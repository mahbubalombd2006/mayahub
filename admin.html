<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Maya Hub News | Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-container">
    <section id="login-section" class="panel">
      <h1>Admin Login</h1>
      <p class="subheading">Sign in to manage news articles.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit">Login</button>
        <p id="login-message" class="message" role="status"></p>
      </form>
    </section>
    <section id="dashboard" class="panel" hidden>
      <div class="dashboard-heading">
        <div><h1>News Dashboard</h1><p class="subheading">Create, edit, publish, and delete news.</p></div>
        <button id="logout-button" class="secondary-button" type="button">Logout</button>
      </div>
      <h2 id="form-heading">Publish News</h2>
      <form id="news-form">
        <label for="news-title">News Title</label>
        <input type="text" id="news-title" maxlength="500" required>
        <label for="news-content">Full News</label>
        <textarea id="news-content" rows="10" required></textarea>
        <label for="news-image">News Image</label>
        <input type="file" id="news-image" accept="image/*">
        <p class="hint">Choose an image for new articles. When editing, leave this empty to keep the existing image.</p>
        <div class="form-actions">
          <button id="publish-button" type="submit">Publish News</button>
          <button id="cancel-edit-button" class="secondary-button" type="button" hidden>Cancel Edit</button>
        </div>
        <p id="news-message" class="message" role="status"></p>
      </form>
      <div class="articles-heading"><h2>Manage News</h2><button id="refresh-button" class="secondary-button" type="button">Refresh</button></div>
      <div id="news-items" class="news-items" aria-live="polite"><p>Loading articles...</p></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
